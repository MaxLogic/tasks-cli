name: Native builds and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            executable: tasks.exe
          - os: ubuntu-22.04
            platform: linux
            executable: tasks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-build
      TASKS_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: |
          $channel = (Get-Content rust-toolchain.toml | Select-String '^channel = "(.*)"$').Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check, test and build CLI
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --features server
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --no-fail-fast --jobs 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --features server,test-hooks --no-fail-fast --jobs 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --bin tasks --jobs 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test archive tooling
        run: python -m unittest discover -s release -p test_package.py -v
      - name: Package and smoke-test extracted CLI
        run: python release/package.py --component cli --platform ${{ matrix.platform }} --input target/release-build/release/${{ matrix.executable }} --commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.platform }}
          path: target/dist/*
          if-no-files-found: error

  viewer:
    name: Windows viewer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TASKS_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned toolchains
        run: |
          git config core.autocrlf true
          $channel = (Get-Content rust-toolchain.toml | Select-String '^channel = "(.*)"$').Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth 1 --branch 3.44.1 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/flutter/bin/flutter.bat" precache --windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" >> $env:GITHUB_PATH
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify and build isolated viewer bundle
        run: |
          # Golden fixtures render local timestamps in the maintainer's Warsaw zone.
          Set-TimeZone -Id 'Central European Standard Time'
          Get-TimeZone
          # Hosted Server 2022 returns bare FLUTTERVIEW; desktop proof runs on Windows 11 before publication.
          pwsh -NoProfile -File viewer/tool/verify-windows.ps1 -FlutterRoot "$env:RUNNER_TEMP/flutter" -PackageOutputRoot "$env:GITHUB_WORKSPACE/target/public-viewer" -GoldenBaseline windows-server-2022 -SkipReleaseUia -EvidenceRoot "$env:GITHUB_WORKSPACE/viewer/target/evidence/viewer/public-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and smoke-test extracted viewer CLI
        run: python release/package.py --component viewer --platform windows --input target/public-viewer --commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: viewer-windows
          path: target/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: viewer-verification
          path: viewer/target/evidence/viewer/public-release/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: viewer-failed-bundle
          path: target/public-viewer/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: viewer-golden-failures
          path: viewer/test/golden/failures/
          if-no-files-found: warn

  publish:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, viewer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-windows'
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-linux
          path: target/dist
      - name: Check tag and release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml'
          files = sorted(Path('target/dist').glob('*.sha256'))
          assert len(files) == 3, 'Expected Windows CLI, Linux CLI and Windows viewer'
          Path('target/dist/SHA256SUMS.txt').write_text(''.join(p.read_text() for p in files))
          PY
          cd target/dist
          sha256sum --check SHA256SUMS.txt
      - name: Upload complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "tasks-cli $RELEASE_TAG" --notes-file release/notes.md
          gh release upload "$RELEASE_TAG" target/dist/*
