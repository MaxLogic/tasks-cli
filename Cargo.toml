[package]
name = "tasks-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
test-hooks = []
server = ["dep:axum", "dep:tokio", "dep:ed25519-dalek", "dep:base64", "dep:sfv", "dep:rand_core", "dep:http-body-util", "dep:reqwest"]

[[bin]]
name = "tasks"
path = "src/main.rs"

[[bin]]
name = "tasks-server"
path = "src/bin/tasks-server.rs"
required-features = ["server"]

[[bin]]
name = "tasks-test-writer"
path = "src/bin/tasks-test-writer.rs"
required-features = ["test-hooks"]

[[bin]]
name = "tasks-test-fixture"
path = "src/bin/tasks-test-fixture.rs"
required-features = ["test-hooks"]

[[bin]]
name = "tasks-perf-fixture"
path = "src/bin/tasks-perf-fixture.rs"
required-features = ["test-hooks"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
file-id = "0.2.3"
fs2 = "0.4.3"
regex = "1.11.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["cache", "bundled", "backup", "trace", "fallible_uint"] }
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
thiserror = "1.0.64"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "io-util"], optional = true }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8", "pem"], optional = true }
base64 = { version = "0.22.1", optional = true }
sfv = { version = "0.14.0", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
http-body-util = { version = "0.1.5", features = ["channel"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
tempfile = "3.12.0"
rcgen = "0.14.10"
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring", "tls12"] }

[package.metadata.cargo-machete]
ignored = ["trace"]
